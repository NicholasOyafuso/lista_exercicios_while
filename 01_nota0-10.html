<meta charset="UTF-8">
<script>
    /*
    PROBLEMA: NOTA ENTRE 0 E 10
    Faça um programa que peça uma nota, entre zero e dez. Mostre uma mensagem caso o valor seja inválido e continue pedindo até que o usuário informe um valor válido.
    */

    //ENTRADA
let numero = Number(prompt("informe um numero de 0 a 10"));

    //PROCESSAMENTO
while(numero < 0 || numero > 10){
    alert(`o numero ${numero} é invalido, larga mão de ser burro`)
    numero = Number(prompt("INFORME UM NUMERO DE 0 A 10"))
}
alert(`boa!, o numero ${numero} é valido`)

    //SAÍDA

</script>
